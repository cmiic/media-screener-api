name: Deploy API Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDOC_VERSION: "2.5.2"
      SITE_DIR: tmp/docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Redoc assets
        run: npm install --ignore-scripts --no-save --no-package-lock redoc@${REDOC_VERSION}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read model metadata
        id: model
        run: |
          source model.env
          echo "sha256=$MODEL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Cache model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/640m.onnx
          key: nudenet-640m-${{ steps.model.outputs.sha256 }}

      - name: Provision model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/provision-model.sh "$RUNNER_TEMP/640m.onnx"

      - name: Build and start container
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t media-screener-api .
          docker run -d --name media-screener-docs -p 8080:8080 \
            --volume "$RUNNER_TEMP/640m.onnx:/models/640m.onnx:ro" \
            media-screener-api
          docker ps

      - name: Wait for container health
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            if ! docker ps --format '{{.Names}}' | grep -qx media-screener-docs; then
              echo "Container exited unexpectedly" >&2
              exit 1
            fi

            status=$(docker inspect -f '{{.State.Health.Status}}' media-screener-docs)
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi

            if [[ "$status" == "unhealthy" ]]; then
              echo "Container became unhealthy" >&2
              docker inspect -f '{{json .State.Health}}' media-screener-docs >&2 || true
              docker logs --tail 100 media-screener-docs >&2 || true
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for container health" >&2
          exit 1

      - name: Generate API documentation
        run: |
          set -euo pipefail
          mkdir -p "$SITE_DIR"
          tmp_openapi=$(mktemp)
          curl -fsS --max-time 15 http://localhost:8080/openapi.json -o "$tmp_openapi"
          mv "$tmp_openapi" "$SITE_DIR/openapi.json"
          cp node_modules/redoc/bundles/redoc.standalone.js "$SITE_DIR/redoc.standalone.js"
          python3 docs/render_redoc.py \
            --spec "$SITE_DIR/openapi.json" \
            --template docs/redoc.html.template \
            --output "$SITE_DIR/index.html"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs media-screener-docs || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./tmp/docs-site

      - name: Stop container
        if: always()
        run: docker stop media-screener-docs || true

  deploy:
    name: Deploy
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
