name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v.+$ ]]; then
            echo "Release tag must start with 'v': $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg APP_VERSION="${TAG#v}" -t "${IMAGE_NAME}:${TAG}" .
          docker push "${IMAGE_NAME}:${TAG}"

      # An SPDX SBOM of each pushed image, attached to the release below. syft
      # runs from its official image pinned by digest and scans each image by
      # the digest the registry now holds, so the SBOM describes exactly what
      # was released; its name and version are the image and the tag. Bump
      # syft here by hand: Dependabot does not follow images run in a step.
      - name: Generate SBOMs
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
          SYFT_IMAGE: docker.io/anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
        run: |
          set -euo pipefail
          # syft's image runs as its own user, which must be able to write here.
          mkdir -p "$RUNNER_TEMP/sbom"
          chmod 777 "$RUNNER_TEMP/sbom"
          sbom() {
            local image="$1" digest
            digest="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{.Manifest.Digest}}')"
            docker run --rm -v "$RUNNER_TEMP/sbom:/out" "$SYFT_IMAGE" scan "registry:${image}@${digest}" \
              --source-name "$image" --source-version "$TAG" \
              -o "spdx-json=/out/${image##*/}-${TAG}.spdx.json"
          }
          sbom "$IMAGE_NAME"

      - name: Create GitHub release
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi

          gh release create "$TAG" --generate-notes

      # A step of its own, so the SBOMs are attached even when the release
      # already existed and the step above stopped early.
      - name: Attach SBOMs
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/sbom/*.spdx.json --clobber
