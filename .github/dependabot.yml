version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "21:25"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - uv
    groups:
      uv-all:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "21:25"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    ignore:
      # Base-image major bumps are handled by hand; digest refreshes and
      # in-track tag changes still come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "21:25"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - devcontainers
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "21:25"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
