[project]
name = "media-screener-api"
version = "0.1.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nudenet==3.4.2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdfium2",
    "python-docx",
    "python-pptx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
