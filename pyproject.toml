[project]
name = "media-screener-api"
# Required by the project table but unused: the project is never built or
# installed, and releases are versioned by git tag (APP_VERSION in Dockerfile).
version = "0.1.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nudenet==3.4.2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdfium2",
    "python-docx",
    "python-pptx",
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

# The SonarQube Cloud workflow measures the unit tests with coverage.py. Paths
# in coverage.xml stay relative to the repository root, where
# sonar-project.properties resolves them; the tests themselves are not source.
[tool.coverage.run]
relative_files = true
source = ["."]
omit = [".venv/*", "tests/*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
