sonar.projectKey=cmiic_media-screener-api
sonar.organization=cmiic
sonar.sourceEncoding=UTF-8

# The service and its scripts, with the Dockerfile, workflows and docs around
# them. Everything under tests/ is a test, everything else is source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**
sonar.exclusions=tests/**
sonar.python.version=3.14

# Coverage is the report the SonarQube Cloud workflow writes before the scan,
# with paths relative to this file. Test files are tests, so they are never
# counted as uncovered source.
sonar.python.coverage.reportPaths=coverage.xml

# Every image is pinned as tag@sha256:digest on purpose: the tag tells
# Dependabot which release track to follow, and the digest makes the reviewed
# image immutable. docker:S8431 asks for one or the other, which would give up
# either the updates or the immutability.
sonar.issue.ignore.multicriteria=tagAndDigest,redocTemplate,loopbackUrl
sonar.issue.ignore.multicriteria.tagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.tagAndDigest.resourceKey=**/Dockerfile

# pythonsecurity:S2083 traces the Redoc template's text into the data that
# render_redoc.py writes, not into a path. The paths it opens are its
# arguments, held inside the working directory (workspace_path), and the only
# value taken from the spec is the HTML-escaped title. Only that file is
# exempt.
sonar.issue.ignore.multicriteria.redocTemplate.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.redocTemplate.resourceKey=docs/render_redoc.py

# shell:S5332 flags the http:// URLs run.sh echoes after starting the
# container. They name the loopback port it publishes; TLS is the gateway's
# job in any cross-host deployment (SECURITY.md, "Deployment assumptions").
sonar.issue.ignore.multicriteria.loopbackUrl.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.loopbackUrl.resourceKey=deploy/run.sh
